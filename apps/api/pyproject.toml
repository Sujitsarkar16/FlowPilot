[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseos-api"
version = "0.1.0"
description = "PulseOS API foundation"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.14.1",
  "asyncpg==0.30.0",
  "cryptography==44.0.1",
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "pydantic-settings==2.7.1",
  "PyJWT==2.10.1",
  "SQLAlchemy==2.0.38",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.21.0",
  "mypy==1.15.0",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
  "ruff==0.9.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
